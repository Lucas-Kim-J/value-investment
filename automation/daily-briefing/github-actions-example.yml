# GitHub Actions workflow for daily briefing
# 复制此文件内容到 repo 根目录的 .github/workflows/briefing.yml
# 必须把 ANTHROPIC_API_KEY / TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID 加到
# repo Settings → Secrets and variables → Actions
#
# 同时把 config.yaml 一起 commit 到私库（含你的持仓 ticker list）

name: Daily Briefing

on:
  schedule:
    # UTC time. 北京时间 07:25 = UTC 前一天 23:25
    - cron: '25 23 * * *'
  workflow_dispatch:  # 允许手动触发测试

jobs:
  briefing:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'automation/daily-briefing/requirements.txt'

      - name: Install dependencies
        run: |
          cd automation/daily-briefing
          pip install -r requirements.txt

      - name: Run briefing
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          cd automation/daily-briefing
          python briefing.py
