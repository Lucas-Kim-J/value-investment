# Canonical nginx vhost for value-investment (static site + input-portal API).
# Installed by server/portfolio-api/setup-api.sh → /etc/nginx/sites-available/value-investment
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    root /var/www/value-investment;
    index dashboard.html index.html;
    server_name _;

    location / {
        try_files $uri $uri/ =404;
    }

    # Input-portal API (Flask via gunicorn; session-auth lives inside the app)
    location /api/ {
        proxy_pass http://127.0.0.1:8787;
        client_max_body_size 15m;   # holdings-screenshot uploads (parse-image)
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # report generation calls hermes (LLM); allow long responses
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }
}
