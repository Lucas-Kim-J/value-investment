# nginx vhost for value-investment as a React SPA (single-page app + input-portal API).
# Replaces nginx-value-investment.conf when the site is served from web/dist.
# Install: copy to /etc/nginx/sites-available/value-investment, then `nginx -t && systemctl reload nginx`.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    root /var/www/value-investment;
    index index.html;
    server_name _;

    # ---- legacy URL redirects (old vanilla *.html bookmarks → SPA routes) ----
    # App pages → client routes. Exact matches; take priority over the regex below.
    location = /dashboard.html    { return 301 /; }
    location = /wiki.html         { return 301 /wiki; }
    location = /portfolio.html    { return 301 /portfolio; }
    location = /analyze.html      { return 301 /analyze$is_args$args; }  # keep ?ticker=…
    location = /canon.html        { return 301 /canon; }
    location = /achievements.html { return 301 /achievements; }
    location = /learn.html        { return 301 /learn; }
    location = /login.html        { return 301 /login; }
    location = /index.html        { return 301 /doc/index; }             # old 方法论 lived at /index.html

    # Static assets (hashed filenames) — cache hard. ^~ so the .html regex never steals these.
    location ^~ /assets/ {
        try_files $uri =404;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Doc content (markdown + extracted HTML) synced by scripts/sync-content.mjs.
    # ^~ keeps /content/*.html served as files (NOT caught by the legacy .html redirect).
    location ^~ /content/ {
        try_files $uri =404;
    }

    # Input-portal API (Flask via gunicorn; session-auth lives inside the app)
    location /api/ {
        proxy_pass http://127.0.0.1:8787;
        client_max_body_size 15m;   # holdings-screenshot uploads (parse-image)
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # report / chat / explain call hermes (LLM); allow long responses
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # Remaining legacy doc URLs: /<path>.html → /doc/<path>
    # (learning/*, routine/*, research/*, product-vision, WAKE-UP, …). Regex runs after the
    # exact-match app pages and the ^~ /content,/assets prefixes, so it only catches old docs.
    location ~ ^/(.+)\.html$ { return 301 /doc/$1; }

    # SPA fallback: serve the app shell for any client route. The shell is served via @spa
    # (try_files file check), NOT a /index.html internal-redirect, so it never re-triggers the
    # `location = /index.html` → /doc/index rule above.
    location / {
        try_files $uri $uri/ @spa;
    }
    location @spa {
        try_files /index.html =404;
    }
}
