<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>学习路线 · 价值投资学习</title>
<link rel="stylesheet" href="assets/style.css">
<link rel="stylesheet" href="assets/app.css">
</head>
<body class="app">
<div class="app-wrap">
  <div id="vi-nav"></div>
  <div class="app-head" data-reveal>
    <div class="eyebrow">Learning Map</div>
    <h1>学习路线</h1>
    <p id="routeIntro">想从哪开始都行，但这是建立框架最稳的顺序。①②③是认知底座，喂给 ④ 持仓审视和 ⑤ 公司分析。</p>
  </div>

  <div id="route"></div>

  <div class="route-tie" data-reveal>
    🔗 <strong>怎么串起来：</strong>读一手内容（②）时遇到生词就去打底（③）；学到的框架用在你的真仓位上（④）；再按你的水平做公司分析（⑤）。
    不确定先看哪站？点右下角 💬 →「📄 看这一页」，让 hermes 按你的进度排个顺序。
  </div>

  <div class="section-t" data-reveal>执行节奏</div>
  <div class="vi-grid vi-rise" style="grid-template-columns:repeat(auto-fill,minmax(220px,1fr))">
    <a class="vi-card" href="routine/glossary.html" data-reveal><div style="font-size:22px">📑</div><h3>Routine 模板</h3><p>每日 / 每周 / 每月 / 每季 + 熔断机制。</p></a>
    <a class="vi-card" href="learning/progress-tracker.html" data-reveal><div style="font-size:22px">📊</div><h3>学习路径追踪</h3><p>90 / 270 / 720 天进度。</p></a>
    <a class="vi-card" href="product-vision.html" data-reveal><div style="font-size:22px">🧭</div><h3>产品理念</h3><p>这套「学习驱动」产品的设计逻辑与不可动摇的原则。</p></a>
  </div>
</div>

<style>.section-t{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;font-weight:600;margin:34px 0 14px;padding-bottom:8px;border-bottom:1px solid var(--border)}</style>
<script src="assets/app.js"></script>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function renderRoute(s){
  const st=(s&&s.stats)||{}, canon=(s&&s.canon_read)||0, terms=(s&&s.term_mastered)||0, holds=st.holdings||0, comp=st.company_analyzed||0;
  let here='canon';
  if (canon===0) here='canon'; else if (terms<3) here='terms'; else if (holds===0) here='hold'; else if (comp===0) here='analyze'; else here='canon';
  const stages = [
    {n:'①', key:'frame', name:'🧭 建立框架', prog:'基本盘 · 随时可读',
      why:'先有地图再上路：方法论 + 估值工具 + 失败案例，建立判断的底层框架。',
      links:[['index.html','方法论 v1.1'],['learning/valuation-cheatsheet.html','估值 4 工具（前 180 天禁 DCF）'],['learning/failure-cases.html','失败案例研究']]},
    {n:'②', key:'canon', name:'📚 学一手内容', prog: canon?`已开始 ${canon} 篇`:'0 篇',
      why:'大师原始思维 = 认知底座。从 Tier0 起点必读挑短的开始，读完写一句你自己的话。',
      links:[['canon.html','一手内容库'],['learning/canon-reading.html','经典文本清单（13 本/套）']]},
    {n:'③', key:'terms', name:'🔍 打术语底座', prog:`已掌握 ${terms} 个`,
      why:'读到不懂的词 ⌘K 即查 / 划词→解释→收入术语库。用自己的话讲对了才算掌握。',
      links:[['wiki.html','术语 Wiki']]},
    {n:'④', key:'hold', name:'💼 管你的仓', prog: holds?`${holds} 个持仓`:'输入端口',
      why:'把 ①②③ 学到的用在真仓位上。录入 → hermes 按方法论审视你的纪律。',
      links:[['portfolio.html','录入持仓 / 生成规范报告']]},
    {n:'⑤', key:'analyze', name:'🏢 做公司分析', prog: comp?`${comp} 次分析`:'产出',
      why:'按你当前阶段分析一家公司，自动归档可回看演进（可从持仓一键带入）。',
      links:[['analyze.html','公司分析']]},
  ];
  $('route').innerHTML = stages.map(z=>`<div class="route-stage${z.key===here?' here':''}" data-reveal>
      <h3><span class="rs-num">${z.n}</span> ${esc(z.name.replace(/^.\s/,''))} <span class="rs-prog">${esc(z.prog)}</span>${z.key===here?'<span class="rs-here">● 你在这里</span>':''}</h3>
      <p>${esc(z.why)}</p>
      <div class="rs-links">${z.links.map(l=>`<a href="${l[0]}">${esc(l[1])} →</a>`).join('')}</div>
    </div>`).join('');
  if (window.VI && VI.motion) VI.motion.scan(document);
}

(async()=>{
  const u = await VI.me(); VI.nav('learn', u);
  let s = null;
  if (u) { try { s = (await VI.api('/api/learning/summary')).data; } catch(e){} }
  else { $('routeIntro').innerHTML += ' <a href="login.html">登录</a> 后这条路线会按你的进度高亮「你在这里」。'; }
  renderRoute(s);
  window.VI = window.VI || {};
  window.VI.pageContext = () => '页面：学习路线（建立框架的建议顺序：① 建立框架 → ② 学一手内容 → ③ 打术语底座 → ④ 管你的仓 → ⑤ 做公司分析）。①②③ 是认知底座，喂给 ④⑤。';
})();
</script>
</body>
</html>
